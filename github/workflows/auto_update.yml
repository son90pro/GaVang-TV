name: Auto Update Gavang33 M3U Playlist

on:
  schedule:
    # Chạy mỗi 3 tiếng một lần (Tính theo giờ UTC: 0, 3, 6, 9, 12, 15, 18, 21h)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công bất kỳ lúc nào

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Cấp quyền ghi để bot tự động commit file m3u vào Repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gavang33 Scraper
        run: python scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist.m3u [skip ci]" && git push)
          
